# AEGIS Semgrep rules. Local only: AEGIS never loads rules from the Semgrep registry.
# Every rule names the AEGIS rule it supports in metadata.aegis_rule_id.
# These are heuristics: they find common shapes of a problem, not every instance.
rules:
  - id: aegis.js.sql-string-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL text is built by concatenation or interpolation. Use bound parameters instead.
    metadata:
      aegis_rule_id: AEGIS-SEC-0001
      aegis_severity: critical
      confidence: MEDIUM
    pattern-either:
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.query($X + "...", ...)
      - pattern: $DB.query(`...${$Y}...`, ...)
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.execute(`...${$Y}...`, ...)

  # Taint rule: SQL text assembled in a variable from request data, then passed to query().
  # The sink is limited to a plain variable name, so a direct "..." + req.x argument is reported
  # only once, by aegis.js.sql-string-concat above.
  - id: aegis.js.sql-tainted-variable
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL text assembled from request data (req.query, req.body or req.params) reaches a query call.
      Use bound parameters instead.
    metadata:
      aegis_rule_id: AEGIS-SEC-0001
      aegis_severity: critical
      confidence: LOW
    pattern-sources:
      - pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
          - focus-metavariable: $SQL
          - metavariable-regex:
              metavariable: $SQL
              regex: ^[A-Za-z_$][A-Za-z0-9_$]*$

  - id: aegis.js.inner-html-assignment
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A non-constant value is assigned to innerHTML or outerHTML. Use textContent, or sanitize the HTML.
    metadata:
      aegis_rule_id: AEGIS-SEC-0002
      aegis_severity: high
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."

  - id: aegis.js.dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      dangerouslySetInnerHTML receives a non-constant value. Make sure it is sanitized.
    metadata:
      aegis_rule_id: AEGIS-SEC-0002
      aegis_severity: high
      confidence: LOW
    patterns:
      - pattern: |
          <$TAG dangerouslySetInnerHTML={{ __html: $X }} />
      - pattern-not: |
          <$TAG dangerouslySetInnerHTML={{ __html: "..." }} />

  - id: aegis.js.document-write
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      document.write receives a non-constant value. Build DOM nodes with text content instead.
    metadata:
      aegis_rule_id: AEGIS-SEC-0002
      aegis_severity: high
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: document.write($X)
          - pattern: document.writeln($X)
      - pattern-not: document.write("...")
      - pattern-not: document.writeln("...")

  - id: aegis.js.insert-adjacent-html
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      insertAdjacentHTML receives a non-constant value. Use insertAdjacentText or build DOM nodes with text content.
    metadata:
      aegis_rule_id: AEGIS-SEC-0002
      aegis_severity: high
      confidence: MEDIUM
    patterns:
      - pattern: $EL.insertAdjacentHTML($POS, $X)
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
