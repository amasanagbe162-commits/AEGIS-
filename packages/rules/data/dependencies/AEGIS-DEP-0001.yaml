id: AEGIS-DEP-0001
title: Verify packages before installing them
category: dependencies
severity: medium
confidence: medium
languages: [javascript, typescript]
frameworks: [node.js]
description: Do not install or upgrade a dependency without the user's approval. Check that the package name is exactly the intended one and that it is maintained, then review the resulting lockfile change.
risk: A misspelled or look-alike package name (typosquatting) or a compromised release can run malicious code on install or at runtime. Unplanned upgrades can also break the application.
appliesWhen: A change adds a new dependency, changes a version range, or runs an install or update command.
badExample:
  language: shell
  code: |
    # UNSAFE: a one-letter typo could install a different, malicious package,
    # and nothing is reviewed before it runs.
    npm install expresss
goodExample:
  language: shell
  code: |
    # Inspect the package first, then install a specific version and review the diff.
    npm view express name version maintainers repository.url
    npm install express@5.1.0
    git diff package.json package-lock.json
  note: The version number is an example. Choose the version the project actually needs.
reasoning: Checking the exact name and metadata first catches look-alike packages, and reviewing the lockfile diff shows what was actually added.
assumptions:
  - The project uses npm and commits its lockfile.
limitations:
  - Metadata checks reduce risk but cannot prove a package is safe.
  - Other package managers and ecosystems need equivalent steps.
prevention:
  - Ask the user before adding or upgrading dependencies.
  - Prefer well-known, maintained packages and avoid adding one for trivial functionality.
  - Consider the --ignore-scripts option when evaluating an unfamiliar package.
verification:
  - Review the lockfile diff for unexpected packages.
  - Run npm audit and the project's tests after the change.
references:
  - https://docs.npmjs.com/cli/v10/commands/npm-audit
  - https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
scanner:
  tool: npm-audit
tests:
  - tests/rules/rule-examples.test.ts checks the structure of both examples. The bad one installs an unpinned name without inspecting it. The good one inspects the package with npm view, then installs an exact version, then reviews the diff.
  - The dependency audit check reports known vulnerable versions found in package-lock.json (tests/integration/real-tools.test.ts runs real npm audit against a vulnerable lockfile). It does not detect typosquatted names or unplanned installs. Those are agent behavior covered by the master file instructions.
version: 1.1.0
status: approved
review:
  reviewerKind: ai-assisted
  reviewer: Claude (AI model), at the request of the project owner
  reviewedAt: 2026-10-26
  gates:
    - metadata-valid
    - description-accurate
    - severity-justified
    - examples-technically-correct
    - corrected-example-solves-the-problem
    - references-legitimate
    - tests-pass
    - scanner-configuration-safe
    - behavior-documented
    - no-secrets
    - dangerous-examples-not-executed-by-tooling
    - compatibility-clear
  notes: >-
    The rule is guidance for agent behavior, so tests check the structure of its examples and the audit check is verified against real npm audit. The Vulnerable Dependency Management cheat sheet is listed in the OWASP Top Ten cheat-sheet index on 2026-10-26. The npm audit documentation URL is the standard page for the npm version Node 22 ships, and it was not opened in this session. Medium severity and confidence reflect that the rule reduces risk but cannot prove a package safe. This is an AI-assisted review. A human maintainer has not yet confirmed it.
