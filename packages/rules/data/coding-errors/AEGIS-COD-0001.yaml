id: AEGIS-COD-0001
title: Handle asynchronous errors explicitly
category: coding-errors
severity: medium
confidence: high
languages: [javascript, typescript]
frameworks: [node.js]
description: Every promise must be awaited or have its rejection handled. A rejected promise that nobody handles can crash the process or fail silently, depending on the runtime and version.
risk: Operations appear to succeed while the work failed, requests hang without a response, or the process terminates unexpectedly.
appliesWhen: Code calls an async function or a promise-returning API, particularly in event handlers, callbacks, timers and route handlers.
badExample:
  language: javascript
  code: |
    // UNSAFE: the call is not awaited, so a failure is never handled
    // and the response is sent before the work finishes.
    app.post("/orders", (req, res) => {
      saveOrder(req.body);
      res.status(201).end();
    });
goodExample:
  language: javascript
  code: |
    // The failure is caught and reported to the caller.
    app.post("/orders", async (req, res) => {
      try {
        await saveOrder(req.body);
        res.status(201).end();
      } catch (err) {
        console.error("saveOrder failed", err);
        res.status(500).json({ error: "Could not save order" });
      }
    });
  note: Express 5 forwards rejected promises from async handlers to its error handler. Older versions do not, so check the version in use.
reasoning: Awaiting the promise makes the outcome part of the control flow, so the response reflects whether the work actually happened.
assumptions:
  - The caller needs the result or the failure of the operation before responding.
limitations:
  - Intentional fire-and-forget work is valid, but it still needs its own error handling such as a catch that logs.
  - Do not log sensitive request data when reporting errors.
  - The ESLint rule needs type information (a TypeScript project with typed linting), and AEGIS only runs it when the project's own ESLint is allowed to run.
prevention:
  - Use await or return the promise, and handle errors in a try/catch or a central error handler.
  - Enable lint rules such as no-floating-promises where available.
  - Do not use a global unhandledRejection handler to hide failures. Handle the error where the promise is created.
verification:
  - Run tests that make the dependency fail and confirm the caller sees an error.
  - Run the linter with floating-promise checks enabled.
references:
  - https://typescript-eslint.io/rules/no-floating-promises
  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises
scanner:
  tool: eslint
  ruleRef: "@typescript-eslint/no-floating-promises"
tests:
  - tests/rules/rule-examples.test.ts runs both examples with a failing saveOrder. The bad handler answers 201 although the work failed and leaves an unhandled rejection. The good handler answers 500 and leaves none.
  - A project whose own ESLint config enables @typescript-eslint/no-floating-promises reports unawaited promises through the lint check. AEGIS does not ship an ESLint config, and the check only runs when project tools are allowed. The ESLint runner itself is verified against real ESLint 9 in tests/integration/real-tools.test.ts.
version: 1.1.0
status: approved
