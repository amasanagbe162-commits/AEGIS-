  notes: >-
    Examples executed against a fake DOM element by tests/rules/rule-examples.test.ts. Semgrep rules measured on fixtures with real Semgrep 1.182.1. OWASP XSS and DOM-based XSS cheat-sheet pages confirmed against search results on 2026-10-26. High severity is justified by script execution as the victim. Sinks beyond the listed ones are not covered and the limitation is documented. This is an AI-assisted review. A human maintainer has not yet confirmed it.
