  notes: >-
    Examples executed against a fake driver by tests/rules/rule-examples.test.ts. Semgrep rules measured on fixtures with real Semgrep 1.182.1 (all direct and variable-assembled samples reported once, corrected samples not reported). OWASP SQL injection and query parameterization cheat-sheet URLs confirmed against search results on 2026-10-26. Critical severity is justified by direct data access and tampering. Confidence is high that the pattern is dangerous, while detection confidence is lower. This is an AI-assisted review. A human maintainer has not yet confirmed it.
